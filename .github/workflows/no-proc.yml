name: NO-PROC

# Run the Linux test suite with /proc not available, see test/no-proc.sh.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  no-proc:
    name: "Linux tests without /proc"
    env:
      GHCVER: 9.10.3
      GHCUP_VERSION: 0.1.50.2

    runs-on: ubuntu-latest

    steps:

    # This should happen before cache restore.
    - name: Remove ~/.ghcup symlink
      run: |
        rm -f ~/.ghcup

    # Saved by the TEST workflow on master
    - name: Restore ghcup and ghc
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.ghcup
        key: ghc-${{ env.GHCVER }}-v-ubuntu-latest

    # Saved by the TEST workflow on master, "cabal update" updates it.
    - name: Restore hackage package index
      uses: actions/cache/restore@v4
      with:
        path: |
            ~/.cache/cabal/packages
        key: cabal-hackage-index

    - name: Cache build dependencies
      uses: actions/cache@v4
      with:
        path: |
            ~/.local/state/cabal
        # Bump the key version to clear the cache
        key: no-proc-ghc-${{ env.GHCVER }}

    - uses: actions/checkout@v4

    # Use a sane PATH, especially to pick the right GHC
    - name: Set PATH to add .local and .ghcup
      run: echo "$HOME/.local/bin:$HOME/.ghcup/bin:/bin:/usr/bin:/usr/sbin" > $GITHUB_PATH

    - name: Download ghc
      run: |
        if ! ghc --version 2>/dev/null | grep -q "$GHCVER" || ! command -v cabal
        then
          curl -sL -o ./ghcup https://downloads.haskell.org/~ghcup/$GHCUP_VERSION/x86_64-linux-ghcup-$GHCUP_VERSION
          chmod +x ./ghcup
          export GHCUP_INSTALL_BASE_PREFIX=$HOME
          ./ghcup install ghc $GHCVER
          ./ghcup set ghc $GHCVER
          ./ghcup install cabal
        fi
        cabal update

    # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor.
    - name: Allow unprivileged user namespaces
      run: |
        f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
        if test -e "$f"
        then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi

    - name: Run the tests without /proc
      run: |
        CABAL_BUILD_OPTIONS="--flag limit-build-mem" test/no-proc.sh
