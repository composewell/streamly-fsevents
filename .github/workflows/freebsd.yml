# FreeBSD CI
#
# FreeBSD is not a native GitHub Actions runner, so this workflow runs
# the build inside a VM via vmactions/freebsd-vm. It is kept separate
# from haskell.yml because the cache/restore step model in that
# workflow (hackage index, ghcup, deps caches) does not apply inside
# the VM.
#
# inotify is in FreeBSD 14.5, 15.0 and later releases.

name: FREEBSD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    name: >-
      freebsd-${{ matrix.release }}
      ${{ matrix.command }}
      ${{ matrix.ghc_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "15.0"
            command: cabal
            ghc_version: 9.14.1

          - release: "14.5"
            command: cabal
            ghc_version: 9.14.1

    steps:
    - uses: actions/checkout@v4

    - name: Build on FreeBSD
      uses: vmactions/freebsd-vm@v1
      env:
        PACKCHECK_COMMAND: ${{ matrix.command }}
        GHCVER: ${{ matrix.ghc_version }}
        # For updating see: https://downloads.haskell.org/~ghcup/
        GHCUP_VERSION: 0.1.50.2
        LC_ALL: C.UTF-8
        CABAL_REINIT_CONFIG: y
        CABAL_CHECK_RELAX: y
        CABAL_PROJECT: cabal.project
        # -j2: with the default -j (4 CPUs) the VM (6 GB) killed cabal
        # while it built the dependencies in parallel in streamly CI.
        CABAL_BUILD_OPTIONS: "-j2 --flag limit-build-mem"
        DISABLE_BENCH: "y"
        DISABLE_DOCS: "y"
        # The SDIST build needs autoreconf for the configure script.
        DISABLE_SDIST_BUILD: "y"
        DISABLE_DIST_CHECKS: "y"
        PACKCHECK: "./packcheck.sh"
        PACKCHECK_GITHUB_URL: "https://raw.githubusercontent.com/composewell/packcheck"
        PACKCHECK_GITHUB_COMMIT: "663ade3f52e77b9f4154ad6483d085a2aedf2901"
      with:
        release: ${{ matrix.release }}
        usesh: true
        copyback: false
        envs: >-
          PACKCHECK_COMMAND GHCVER GHCUP_VERSION LC_ALL
          CABAL_REINIT_CONFIG CABAL_CHECK_RELAX CABAL_PROJECT CABAL_BUILD_OPTIONS
          DISABLE_BENCH DISABLE_DOCS DISABLE_SDIST_BUILD DISABLE_DIST_CHECKS
          PACKCHECK PACKCHECK_GITHUB_URL PACKCHECK_GITHUB_COMMIT
        # IGNORE_OSVERSION: the ports repository may have packages built for
        # a later minor release than the VM, pkg refuses to update then.
        prepare: |
          export IGNORE_OSVERSION=yes
          pkg update
          pkg install -y gmake
          pkg install -y bash
          pkg install -y git
          pkg install -y gmp
          # The ghcup and GHC binaries are built on FreeBSD 14 and need
          # its shared libraries (e.g. libutil.so.9) on FreeBSD 15.
          case "$(freebsd-version)" in
            15.*) pkg install -y compat14x-amd64 ;;
          esac
        run: |
          sysctl vfs.inotify || true
          # Diagnostics: a port may install a sys/inotify.h in
          # /usr/local/include that shadows the base system header.
          pkg info | grep -i inotify || true
          ls -l /usr/local/include/sys/inotify.h || true
          grep -n MASK_CREATE /usr/include/sys/inotify.h || true
          if test ! -e "$PACKCHECK"
          then
            if test -z "$PACKCHECK_GITHUB_COMMIT"
            then
              echo "PACKCHECK_GITHUB_COMMIT is not specified." >&2
              exit 1
            fi
            PACKCHECK_URL=${PACKCHECK_GITHUB_URL}/${PACKCHECK_GITHUB_COMMIT}/packcheck.sh
            curl --fail -sL -o "$PACKCHECK" $PACKCHECK_URL || exit 1
            chmod +x $PACKCHECK
          elif test ! -x "$PACKCHECK"
          then
            chmod +x $PACKCHECK
          fi
          # Use "bash -c" instead of invoking directly to preserve quoted
          # arguments in PACKCHECK_COMMAND.
          bash -c "$PACKCHECK $PACKCHECK_COMMAND" || exit 1
          # The VM runs as root, root is not denied any permission and the
          # permission tests are skipped. Run the suites with these tests
          # again as a normal user. The binaries are copied to a directory
          # that the user can read.
          pw useradd fsevtest -m -s /bin/sh || exit 1
          mkdir -p /tmp/fsevtest-bin
          for t in FileSystem.Event.Behavior FileSystem.Event.FreeBSD
          do
            bin=$(find dist-newstyle -type f -perm -u+x -name "$t" | head -1)
            test -n "$bin" || { echo "$t: test binary not found" >&2; exit 1; }
            cp "$bin" /tmp/fsevtest-bin/ || exit 1
          done
          chmod -R a+rx /tmp/fsevtest-bin
          su -l fsevtest -c "export LC_ALL=$LC_ALL &&
            /tmp/fsevtest-bin/FileSystem.Event.Behavior &&
            /tmp/fsevtest-bin/FileSystem.Event.FreeBSD"
